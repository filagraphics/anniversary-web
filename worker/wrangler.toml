name = "visit-notify"
main = "visit-notify.js"
compatibility_date = "2024-11-01"

# Only this origin may trigger notifications.
[vars]
ALLOW_ORIGIN = "https://stillchoosingyou.philipos.dev"

# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are secrets — do NOT put them here.
# Set them with:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
